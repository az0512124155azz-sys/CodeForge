name: Import Code-OSS foundation v0.0.6

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-codeoss:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CodeForge bootstrap branch
        uses: actions/checkout@v4
        with:
          ref: bootstrap/codeoss-core
          fetch-depth: 0
          lfs: false

      - name: Show importer version
        shell: bash
        run: echo "CodeForge importer version 0.0.6"

      - name: Preserve CodeForge overlay
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/codeforge-overlay /tmp/vscode-main /tmp/vscode.tar.gz
          mkdir -p /tmp/codeforge-overlay/.github/workflows
          cp -a .codeforge /tmp/codeforge-overlay/ 2>/dev/null || true
          cp .github/workflows/import-codeoss.yml /tmp/codeforge-overlay/.github/workflows/import-codeoss.yml
          cp README.md /tmp/codeforge-overlay/README.CODEFORGE.md 2>/dev/null || true

      - name: Download Code-OSS source archive
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 2 \
            https://codeload.github.com/microsoft/vscode/tar.gz/refs/heads/main \
            -o /tmp/vscode.tar.gz
          mkdir -p /tmp/vscode-main
          tar -xzf /tmp/vscode.tar.gz -C /tmp/vscode-main --strip-components=1
          test -f /tmp/vscode-main/package.json
          test -d /tmp/vscode-main/src

      - name: Replace working tree with Code-OSS
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/vscode-main/. .

      - name: Restore CodeForge overlay
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .codeforge
          cp -a /tmp/codeforge-overlay/.codeforge ./.codeforge
          mkdir -p .github/workflows
          cp /tmp/codeforge-overlay/.github/workflows/import-codeoss.yml .github/workflows/import-codeoss.yml
          if [ -f /tmp/codeforge-overlay/README.CODEFORGE.md ]; then
            cp /tmp/codeforge-overlay/README.CODEFORGE.md CODEFORGE.md
          fi

      - name: Remove unavailable upstream LFS test fixtures
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extensions/copilot/test/simulation/cache
          git lfs uninstall --local || true
          rm -f .git/hooks/pre-push || true
          echo "Removed upstream Copilot LFS-only test cache; these fixtures are not required for CodeForge bootstrap/build."

      - name: Apply initial CodeForge product branding
        shell: bash
        run: |
          set -euo pipefail
          node .codeforge/scripts/apply-branding.mjs

      - name: Verify imported foundation
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f product.json
          test -d src/vs
          test -d extensions
          test ! -d extensions/copilot/test/simulation/cache
          echo "Code-OSS foundation is present and unavailable LFS fixtures were excluded."

      - name: Commit imported foundation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bootstrap CodeForge from Code-OSS" || true
          git push --no-verify origin HEAD:bootstrap/codeoss-core
