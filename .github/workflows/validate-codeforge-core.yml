name: Validate CodeForge Core

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/vs/workbench/contrib/codeforge/**'
      - 'src/vs/workbench/browser/workbench.zenMode.contribution.ts'
      - '.github/workflows/validate-codeforge-core.yml'

permissions:
  contents: read

jobs:
  typecheck-core:
    name: Validate CodeForge workbench core
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout CodeForge
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install TypeScript dependencies
        run: npm ci --ignore-scripts

      # These sources import deep Code-OSS services, so a standalone tsc project
      # either infers the wrong rootDir or loads the entire client graph and OOMs
      # on hosted runners. The repository's focused ESLint entry point parses the
      # TypeScript and applies the official source and architecture rules.
      - name: Lint CodeForge workbench core
        run: node build/eslint.ts src/vs/workbench/contrib/codeforge/browser/codeforgeLifecycle.ts src/vs/workbench/contrib/codeforge/browser/codeforge.contribution.ts
