name: Validate CodeForge Core

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/vs/workbench/contrib/codeforge/**'
      - 'src/vs/workbench/browser/workbench.zenMode.contribution.ts'
      - '.github/workflows/validate-codeforge-core.yml'

permissions:
  contents: read

jobs:
  typecheck-core:
    name: Type-check CodeForge workbench core
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout CodeForge
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install TypeScript dependencies
        run: npm ci --ignore-scripts

      # CodeForge's workbench contribution imports Code-OSS services outside its
      # folder. Type-check it through the client project so TypeScript uses the
      # same source root as the desktop build rather than producing false
      # TS6059 "not under rootDir" failures.
      - name: Type-check CodeForge workbench core
        run: node node_modules/typescript/bin/tsc6 --project src/tsconfig.json --noEmit --skipLibCheck
